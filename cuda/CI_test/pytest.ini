[pytest]
testpaths = tests
addopts = -q --tb=short
filterwarnings =
    # Import-order mistake (numpy before precision_pc) must never pass silently.
    # BLAS reads its thread count once, at load time, so a late pin does nothing and
    # the E0.1 noise floor would silently stop being zero.
    error:numpy was imported before:RuntimeWarning
